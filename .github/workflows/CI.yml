name: CI
on:
  pull_request:
    branches:
      - master

jobs:
  unit-test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .vscode-test
            bin
          key: ${{ runner.os }}-vscode-shfmt-${{ hashFiles('package-lock.json', 'src/config.ts') }}
          restore-keys: ${{ runner.os }}-vscode-shfmt-
      - name: Run tests
        if: matrix.os == 'ubuntu-latest'
        uses: GabrielBB/xvfb-action@v1.7
        with:
          run: npm test
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: npm test
