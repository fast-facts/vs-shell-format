name: CI
on:
  pull_request:
    branches:
      - master

jobs:
  unit-test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format-check
      - name: Run headless test
        uses: GabrielBB/xvfb-action@v1.7
        if: matrix.os != 'windows-latest'
        with:
          run: npm test
