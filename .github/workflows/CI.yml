name: CI
on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.0'
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-latest is arm64; free arm64 runners often never start
        os: [ubuntu-latest, macos-26-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.0'
          cache: npm
      - run: npm ci
      - name: Run tests
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum npm test
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: npm test
