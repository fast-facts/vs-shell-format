name: CD

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  unit-test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format-check
      - name: Run headless test
        uses: GabrielBB/xvfb-action@v1.7
        if: matrix.os != 'windows-latest'
        with:
          run: npm test

  release:
    runs-on: ubuntu-latest
    needs: unit-test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.PUBLISHER_TOKEN }}
        run: npx --yes -p semantic-release -p semantic-release-vsce semantic-release
