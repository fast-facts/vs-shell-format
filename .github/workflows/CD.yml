name: CD

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  unit-test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .vscode-test
            bin
          key: ${{ runner.os }}-vscode-shfmt-${{ hashFiles('package-lock.json', 'src/config.ts') }}
          restore-keys: ${{ runner.os }}-vscode-shfmt-
      - name: Run tests
        if: matrix.os == 'ubuntu-latest'
        uses: GabrielBB/xvfb-action@v1.7
        with:
          run: npm test
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: npm test

  release:
    runs-on: ubuntu-latest
    needs: unit-test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.PUBLISHER_TOKEN }}
        run: npx --yes -p semantic-release -p semantic-release-vsce semantic-release
